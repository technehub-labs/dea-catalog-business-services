catalog:
  name: Digital Business Service Factory
  abbreviation: DBSF
  id: dea:catalog-dbsf
  version: "1.0.0-alpha"
  status: active
  metamodel_version: "^0.1.0"
  description: >
    Enterprise business service definitions, capability decompositions,
    and solution component mappings for TechNeHub Labs.
  repository: https://github.com/technehub-labs/dea-catalog-digital-business-service-factory
  owner: TechNeHub Labs
  license: MIT

  domains:
    - id: customer
      name: Customer
      services: [customer-360, customer-identity, customer-notification]
      capabilities: [customer-data-management, customer-identity-resolution, customer-engagement]
    - id: product
      name: Product
      services: [product-catalog, product-lifecycle, product-pricing]
      capabilities: [product-information-management, product-revenue-management]
    - id: order
      name: Order Management
      services: [order-taking, order-fulfillment, order-tracking]
      capabilities: [order-management, fulfillment-orchestration]
    - id: finance
      name: Finance
      services: [finance-accounting, finance-reporting, treasury-management]
      capabilities: [financial-closing, financial-planning, cash-management]
    - id: supply-chain
      name: Supply Chain
      services: [inventory-management, procurement, logistics-coordination]
      capabilities: [supply-chain-planning, supplier-management]
    - id: hr
      name: Human Resources
      services: [hr-core, talent-management, payroll]
      capabilities: [workforce-planning, talent-acquisition, compensation-management]

  tags:
    - business-service
    - capability-map
    - enterprise
    - governance
