# Human Resources Domain Business Services
# DEA Metamodel Entity: BusinessService

services:
  - id: dea:service-hr-core
    type: BusinessService
    name: HR Core Service
    abbreviation: HRC
    version: "1.0.0"
    status: active
    description: >
      Core HR operations including employee records, organization management,
      benefits administration, and HR self-service portals.
    domain: Human Resources
    subdomain: Core HR
    capabilities:
      - dea:capability-workforce-planning
    governance:
      sla_uptime: "99.9%"
      security_classification: Restricted
      compliance:
        - GDPR
        - HIPAA
        - EEOC
    solution_components:
      - dea:component-hcm-system
      - dea:component-benefits-management-system
    relationships:
      - source_id: dea:service-hr-core
        target_id: dea:principle-data-privacy
        relationship_type: implements
    tags:
      - hr
      - employee
      - benefits
      - hcm

  - id: dea:service-talent-management
    type: BusinessService
    name: Talent Management Service
    abbreviation: TMS
    version: "1.0.0"
    status: active
    description: >
      Talent acquisition, onboarding, performance management, learning and development,
      succession planning, and career development.
    domain: Human Resources
    subdomain: Talent
    capabilities:
      - dea:capability-talent-acquisition
    governance:
      sla_uptime: "99.9%"
      security_classification: Confidential
      compliance:
        - GDPR
        - EEOC
    solution_components:
      - dea:component-talent-acquisition-system
      - dea:component-lms-system
      - dea:component-performance-management-system
    relationships:
      - source_id: dea:service-talent-management
        target_id: dea:service-hr-core
        relationship_type: depends_on
    tags:
      - hr
      - talent
      - recruitment
      - learning
      - performance

  - id: dea:service-payroll
    type: BusinessService
    name: Payroll Service
    abbreviation: PRL
    version: "1.0.0"
    status: active
    description: >
      Payroll processing including salary calculation, tax withholding, direct deposit,
      payroll reporting, and year-end tax form generation.
    domain: Human Resources
    subdomain: Payroll
    capabilities:
      - dea:capability-compensation-management
    governance:
      sla_uptime: "99.99%"
      security_classification: Restricted
      compliance:
        - GDPR
        - HIPAA
        - IRS
        - state-tax
    solution_components:
      - dea:component-payroll-system
      - dea:component-time-and-attendance-system
    relationships:
      - source_id: dea:service-payroll
        target_id: dea:service-hr-core
        relationship_type: depends_on
      - source_id: dea:service-payroll
        target_id: dea:principle-accuracy-first
        relationship_type: implements
    tags:
      - hr
      - payroll
      - compensation
      - tax
