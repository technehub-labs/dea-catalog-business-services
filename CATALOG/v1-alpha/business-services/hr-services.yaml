# Human Resources Domain Business Services

entries:
  - id: dea:service-hr-core
    type: BusinessService
    name: HR Core Service
    abbreviation: HRCS
    version: "1.0.0"
    status: active
    description: >
      Core HR operations: employee master data, organisational structure, employment
      records, and HR transactions. The system of record for the entire employee
      lifecycle from hire to retirement.
    domain: Human Resources
    subdomain: Core HR
    capabilities:
      - dea:capability-workforce-planning
    governance:
      sla_tier: Gold
      sla_uptime: "99.95%"
      recovery_time_minutes: 60
      security_classification: Restricted
      compliance:
        - GDPR
        - HIPAA
    solution_components:
      - dea:component-hris
    relationships:
      - source_id: dea:service-hr-core
        target_id: dea:service-talent-management
        relationship_type: feeds
      - source_id: dea:service-hr-core
        target_id: dea:service-payroll
        relationship_type: supplies
    tags:
      - hr
      - hris
      - employee-data
      - gdpr

  - id: dea:service-talent-management
    type: BusinessService
    name: Talent Management Service
    abbreviation: TMSvc
    version: "1.0.0"
    status: active
    description: >
      Talent acquisition, performance management, learning and development,
      succession planning, and career development. Manages the full talent lifecycle.
    domain: Human Resources
    subdomain: Talent
    capabilities:
      - dea:capability-talent-acquisition
    governance:
      sla_tier: Silver
      sla_uptime: "99.9%"
      recovery_time_minutes: 240
      security_classification: Confidential
      compliance:
        - GDPR
    solution_components:
      - dea:component-talent-management-system
    relationships:
      - source_id: dea:service-talent-management
        target_id: dea:service-hr-core
        relationship_type: receives_from
    tags:
      - hr
      - talent
      - recruitment
      - performance

  - id: dea:service-payroll
    type: BusinessService
    name: Payroll Service
    abbreviation: PYS
    version: "1.0.0"
    status: active
    description: >
      Payroll processing: salary calculation, tax withholding, benefits deductions,
      direct deposit, and payroll reporting. Interfaces with time and attendance,
      benefits administration, and tax filing systems.
    domain: Human Resources
    subdomain: Payroll
    capabilities:
      - dea:capability-compensation-management
    governance:
      sla_tier: Platinum
      sla_uptime: "99.99%"
      recovery_time_minutes: 15
      security_classification: Restricted
      compliance:
        - SOX
        - GDPR
        - HIPAA
    solution_components:
      - dea:component-payroll-system
    relationships:
      - source_id: dea:service-payroll
        target_id: dea:service-hr-core
        relationship_type: depends_on
      - source_id: dea:service-payroll
        target_id: dea:service-finance-accounting
        relationship_type: posts_to
    tags:
      - hr
      - payroll
      - sox
      - platinum-sla
