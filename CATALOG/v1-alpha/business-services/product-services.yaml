# Product Domain Business Services

entries:
  - id: dea:service-product-catalog
    type: BusinessService
    name: Product Catalog Service
    abbreviation: PCS
    version: "1.0.0"
    status: active
    description: >
      Manages the enterprise product catalogue: product definitions, pricing,
      hierarchies, variants, and lifecycle states. The authoritative source of
      product information for commerce, ERP, and analytics systems.
    domain: Product
    subdomain: Catalog Management
    capabilities:
      - dea:capability-product-information-management
    governance:
      sla_tier: Gold
      sla_uptime: "99.95%"
      recovery_time_minutes: 60
      security_classification: Internal
      compliance: []
    solution_components:
      - dea:component-product-information-system
      - dea:component-pricing-engine
    relationships:
      - source_id: dea:service-product-catalog
        target_id: dea:service-order-taking
        relationship_type: supplies
      - source_id: dea:service-product-catalog
        target_id: dea:principle-data-ownership
        relationship_type: implements
    tags:
      - product
      - catalog
      - pim

  - id: dea:service-product-lifecycle
    type: BusinessService
    name: Product Lifecycle Management Service
    abbreviation: PLMS
    version: "1.0.0"
    status: active
    description: >
      Manages product lifecycles from ideation through launch, growth, maintenance,
      and retirement. Integrates with engineering, marketing, and supply chain systems.
    domain: Product
    subdomain: Lifecycle
    capabilities:
      - dea:capability-product-revenue-management
    governance:
      sla_tier: Silver
      sla_uptime: "99.9%"
      recovery_time_minutes: 240
      security_classification: Internal
      compliance: []
    solution_components:
      - dea:component-plm-system
    relationships:
      - source_id: dea:service-product-lifecycle
        target_id: dea:service-product-catalog
        relationship_type: manages_lifecycle_of
    tags:
      - product
      - lifecycle
      - plm

  - id: dea:service-product-pricing
    type: BusinessService
    name: Product Pricing Service
    abbreviation: PPS
    version: "1.0.0"
    status: active
    description: >
      Centralised pricing management: price lists, discount rules, promotional pricing,
      customer-specific pricing, and currency conversion. Enforces pricing governance
      and prevents unauthorised discounting.
    domain: Product
    subdomain: Pricing
    capabilities:
      - dea:capability-product-revenue-management
    governance:
      sla_tier: Gold
      sla_uptime: "99.95%"
      recovery_time_minutes: 60
      security_classification: Confidential
      compliance: []
    solution_components:
      - dea:component-pricing-engine
    relationships:
      - source_id: dea:service-product-pricing
        target_id: dea:service-product-catalog
        relationship_type: depends_on
      - source_id: dea:service-product-pricing
        target_id: dea:service-order-taking
        relationship_type: prices
    tags:
      - product
      - pricing
      - revenue
