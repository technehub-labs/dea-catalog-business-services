# Order Management Domain Business Services

entries:
  - id: dea:service-order-taking
    type: BusinessService
    name: Order Taking Service
    abbreviation: OTS
    version: "1.0.0"
    status: active
    description: >
      Order capture across all channels: e-commerce, contact centre, field sales.
      Validates orders against product availability, pricing, and customer credit limits.
      Creates order records and hands off to fulfillment.
    domain: Order Management
    subdomain: Order Capture
    capabilities:
      - dea:capability-order-management
    governance:
      sla_tier: Platinum
      sla_uptime: "99.99%"
      recovery_time_minutes: 15
      security_classification: Confidential
      compliance:
        - PCI-DSS
    solution_components:
      - dea:component-order-management-system
      - dea:component-ecommerce-platform
    relationships:
      - source_id: dea:service-order-taking
        target_id: dea:service-product-catalog
        relationship_type: references
      - source_id: dea:service-order-taking
        target_id: dea:service-product-pricing
        relationship_type: prices
      - source_id: dea:service-order-taking
        target_id: dea:service-order-fulfillment
        relationship_type: hands_off_to
    tags:
      - order
      - commerce
      - pci-dss
      - platinum-sla

  - id: dea:service-order-fulfillment
    type: BusinessService
    name: Order Fulfillment Service
    abbreviation: OFS
    version: "1.0.0"
    status: active
    description: >
      Orchestrates order fulfillment from reservation through shipment. Manages
      allocation, picking, packing, shipping, and proof of delivery. Interfaces
      with warehouse management and carrier systems.
    domain: Order Management
    subdomain: Fulfillment
    capabilities:
      - dea:capability-fulfillment-orchestration
    governance:
      sla_tier: Gold
      sla_uptime: "99.95%"
      recovery_time_minutes: 60
      security_classification: Internal
      compliance: []
    solution_components:
      - dea:component-warehouse-management-system
      - dea:component-carrier-integration
    relationships:
      - source_id: dea:service-order-fulfillment
        target_id: dea:service-order-taking
        relationship_type: receives_from
      - source_id: dea:service-order-fulfillment
        target_id: dea:service-inventory-management
        relationship_type: depends_on
      - source_id: dea:service-order-fulfillment
        target_id: dea:service-logistics-coordination
        relationship_type: coordinates_with
    tags:
      - order
      - fulfillment
      - logistics

  - id: dea:service-order-tracking
    type: BusinessService
    name: Order Tracking Service
    abbreviation: ORTS
    version: "1.0.0"
    status: active
    description: >
      Provides real-time order and shipment tracking to customers and internal teams.
      Aggregates status from fulfillment, logistics, and carrier systems. Delivers
      notifications at key order milestones.
    domain: Order Management
    subdomain: Tracking
    capabilities:
      - dea:capability-order-management
    governance:
      sla_tier: Gold
      sla_uptime: "99.95%"
      recovery_time_minutes: 60
      security_classification: Internal
      compliance: []
    solution_components:
      - dea:component-tracking-engine
      - dea:component-notification-gateway
    relationships:
      - source_id: dea:service-order-tracking
        target_id: dea:service-order-fulfillment
        relationship_type: subscribes_to
      - source_id: dea:service-order-tracking
        target_id: dea:service-logistics-coordination
        relationship_type: integrates_with
    tags:
      - order
      - tracking
      - customer-experience
