# Finance Domain Business Services

entries:
  - id: dea:service-finance-accounting
    type: BusinessService
    name: Finance Accounting Service
    abbreviation: FAS
    version: "1.0.0"
    status: active
    description: >
      Core accounting operations including general ledger, accounts payable, accounts
      receivable, fixed assets, and period-end closing. Maintains the authoritative
      financial record of all enterprise transactions.
    domain: Finance
    subdomain: Core Accounting
    capabilities:
      - dea:capability-financial-closing
    governance:
      sla_tier: Platinum
      sla_uptime: "99.99%"
      recovery_time_minutes: 15
      security_classification: Restricted
      compliance:
        - SOX
        - IFRS
        - GAAP
    solution_components:
      - dea:component-erp-core
      - dea:component-general-ledger
    relationships:
      - source_id: dea:service-finance-accounting
        target_id: dea:principle-data-integrity
        relationship_type: implements
      - source_id: dea:service-finance-accounting
        target_id: dea:service-finance-reporting
        relationship_type: feeds
    tags:
      - finance
      - accounting
      - sox
      - platinum-sla

  - id: dea:service-finance-reporting
    type: BusinessService
    name: Finance Reporting and Analytics Service
    abbreviation: FRAS
    version: "1.0.0"
    status: active
    description: >
      Financial reporting, management reporting, budgeting, and variance analysis.
      Produces statutory, management, and ad-hoc financial reports from the general
      ledger and sub-ledgers.
    domain: Finance
    subdomain: Reporting
    capabilities:
      - dea:capability-financial-planning
    governance:
      sla_tier: Gold
      sla_uptime: "99.95%"
      recovery_time_minutes: 60
      security_classification: Restricted
      compliance:
        - SOX
        - IFRS
    solution_components:
      - dea:component-financial-reporting-engine
      - dea:component-bi-platform
    relationships:
      - source_id: dea:service-finance-reporting
        target_id: dea:service-finance-accounting
        relationship_type: depends_on
      - source_id: dea:service-finance-reporting
        target_id: dea:principle-data-ownership
        relationship_type: implements
    tags:
      - finance
      - reporting
      - analytics
      - sox

  - id: dea:service-treasury-management
    type: BusinessService
    name: Treasury Management Service
    abbreviation: TMS
    version: "1.0.0"
    status: active
    description: >
      Cash management, liquidity forecasting, debt management, investment management,
      and treasury operations. Interfaces with banking partners and payment processors
      to manage the enterprise's cash position in real time.
    domain: Finance
    subdomain: Treasury
    capabilities:
      - dea:capability-cash-management
    governance:
      sla_tier: Platinum
      sla_uptime: "99.99%"
      recovery_time_minutes: 15
      security_classification: Restricted
      compliance:
        - SOX
        - Basel III
    solution_components:
      - dea:component-treasury-management-system
      - dea:component-payment-gateway
    relationships:
      - source_id: dea:service-treasury-management
        target_id: dea:service-finance-accounting
        relationship_type: integrates_with
      - source_id: dea:service-treasury-management
        target_id: dea:principle-zero-trust
        relationship_type: implements
    tags:
      - finance
      - treasury
      - cash-management
      - payments
      - platinum-sla
