# Supply Chain Domain Business Services

entries:
  - id: dea:service-inventory-management
    type: BusinessService
    name: Inventory Management Service
    abbreviation: IMS
    version: "1.0.0"
    status: active
    description: >
      Tracks inventory levels across all locations: warehouses, distribution centres,
      retail locations, and in-transit. Manages reorder points, safety stock, and
      inventory valuation. Provides real-time inventory visibility.
    domain: Supply Chain
    subdomain: Inventory
    capabilities:
      - dea:capability-supply-chain-planning
    governance:
      sla_tier: Gold
      sla_uptime: "99.95%"
      recovery_time_minutes: 60
      security_classification: Internal
      compliance: []
    solution_components:
      - dea:component-inventory-management-system
      - dea:component-warehouse-management-system
    relationships:
      - source_id: dea:service-inventory-management
        target_id: dea:service-order-fulfillment
        relationship_type: supplies
      - source_id: dea:service-inventory-management
        target_id: dea:service-procurement
        relationship_type: triggers_replenishment
    tags:
      - supply-chain
      - inventory
      - warehouse

  - id: dea:service-procurement
    type: BusinessService
    name: Procurement Service
    abbreviation: PS
    version: "1.0.0"
    status: active
    description: >
      Manages the end-to-end procurement process: requisitioning, supplier selection,
      purchase order creation, goods receipt, and invoice matching. Governs supplier
      relationships and procurement policies.
    domain: Supply Chain
    subdomain: Procurement
    capabilities:
      - dea:capability-supplier-management
    governance:
      sla_tier: Silver
      sla_uptime: "99.9%"
      recovery_time_minutes: 240
      security_classification: Internal
      compliance:
        - SOX
    solution_components:
      - dea:component-procurement-system
      - dea:component-supplier-portal
    relationships:
      - source_id: dea:service-procurement
        target_id: dea:service-inventory-management
        relationship_type: replenishes
      - source_id: dea:service-procurement
        target_id: dea:service-finance-accounting
        relationship_type: posts_to
    tags:
      - supply-chain
      - procurement
      - purchasing
      - sox

  - id: dea:service-logistics-coordination
    type: BusinessService
    name: Logistics Coordination Service
    abbreviation: LCS
    version: "1.0.0"
    status: active
    description: >
      Coordinates inbound and outbound logistics: carrier management, route
      optimisation, shipment tracking, and freight cost management. Interfaces with
      customs for cross-border shipments.
    domain: Supply Chain
    subdomain: Logistics
    capabilities:
      - dea:capability-supply-chain-planning
    governance:
      sla_tier: Silver
      sla_uptime: "99.9%"
      recovery_time_minutes: 240
      security_classification: Internal
      compliance: []
    solution_components:
      - dea:component-tms
      - dea:component-carrier-integration
    relationships:
      - source_id: dea:service-logistics-coordination
        target_id: dea:service-order-fulfillment
        relationship_type: ships
      - source_id: dea:service-logistics-coordination
        target_id: dea:service-inventory-management
        relationship_type: receives_from
    tags:
      - supply-chain
      - logistics
      - tms
      - freight
