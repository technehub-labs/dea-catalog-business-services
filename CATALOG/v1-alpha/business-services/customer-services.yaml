# Digital Business Service Factory — Business Service Entries

entries:
  - id: dea:service-customer-360
    type: BusinessService
    name: Customer 360 Service
    abbreviation: C360
    version: "1.0.0"
    status: active
    description: >
      Provides a unified, real-time view of all customer interactions, attributes,
      and history across all channels and touchpoints. The single source of customer
      truth for all enterprise systems.
    domain: Customer
    subdomain: Customer Insight
    capabilities:
      - dea:capability-customer-data-management
      - dea:capability-customer-identity-resolution
      - dea:capability-customer-engagement
    governance:
      sla_tier: Platinum
      sla_uptime: "99.99%"
      recovery_time_minutes: 15
      security_classification: Confidential
      compliance:
        - GDPR
        - CCPA
    solution_components:
      - dea:component-customer-data-platform
      - dea:component-identity-resolution-service
    relationships:
      - source_id: dea:service-customer-360
        target_id: dea:principle-data-ownership
        relationship_type: implements
      - source_id: dea:service-customer-360
        target_id: dea:pattern-cqrs
        relationship_type: realised_through
      - source_id: dea:service-customer-360
        target_id: dea:service-product-catalog
        relationship_type: depends_on
    tags:
      - customer
      - data-platform
      - real-time
      - gdpr
      - platinum-sla

  - id: dea:service-customer-identity
    type: BusinessService
    name: Customer Identity Service
    abbreviation: CIS
    version: "1.0.0"
    status: active
    description: >
      Manages customer identity across all channels using probabilistic and deterministic
      matching. Resolves fragmented identities into a single customer identity graph
      with confidence scores and merge/purge policies.
    domain: Customer
    subdomain: Identity
    capabilities:
      - dea:capability-customer-identity-resolution
    governance:
      sla_tier: Gold
      sla_uptime: "99.95%"
      recovery_time_minutes: 60
      security_classification: Confidential
      compliance:
        - GDPR
        - CCPA
    solution_components:
      - dea:component-identity-resolution-service
    relationships:
      - source_id: dea:service-customer-identity
        target_id: dea:service-customer-360
        relationship_type: feeds
      - source_id: dea:service-customer-identity
        target_id: dea:principle-privacy-by-design
        relationship_type: implements
    tags:
      - customer
      - identity
      - identity-resolution
      - gdpr

  - id: dea:service-customer-notification
    type: BusinessService
    name: Customer Notification Service
    abbreviation: CNS
    version: "1.0.0"
    status: active
    description: >
      Manages all outbound customer communications: email, SMS, push notifications,
      and in-app messaging. Supports preference management, template rendering, and
      delivery tracking with unsubscribe handling.
    domain: Customer
    subdomain: Engagement
    capabilities:
      - dea:capability-customer-engagement
    governance:
      sla_tier: Gold
      sla_uptime: "99.95%"
      recovery_time_minutes: 60
      security_classification: Internal
      compliance:
        - GDPR
    solution_components:
      - dea:component-notification-gateway
    relationships:
      - source_id: dea:service-customer-notification
        target_id: dea:service-customer-360
        relationship_type: subscribes_to
      - source_id: dea:service-customer-notification
        target_id: dea:principle-api-first
        relationship_type: implements
    tags:
      - customer
      - notifications
      - engagement
