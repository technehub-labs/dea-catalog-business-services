      - component_id: dea:component-warehouse-management-system
        relationship: realised_through
      - component_id: dea:component-fulfillment-engine
        relationship: realised_through

  - service_id: dea:service-order-tracking
    service_name: Order Tracking Service
    components:
      - component_id: dea:component-tracking-engine
        relationship: realised_through
      - component_id: dea:component-notification-gateway
        relationship: depends_on

  # ─── Supply Chain Domain ────────────────────────────────────────
  - service_id: dea:service-inventory-management
