# Service-to-Solution Component Mappings

mappings:
  description: >
    Declares the typed relationships between business services
    and the solution components that realise them.

  service_components:
    - service: dea:service-customer-360
      components:
        - id: dea:component-customer-data-platform
          relationship: realised_through
          description: CDP provides unified customer data ingestion, identity resolution, and activation
        - id: dea:component-identity-resolution-service
          relationship: realised_through
          description: Identity service handles probabilistic and deterministic identity matching

    - service: dea:service-customer-identity
      components:
        - id: dea:component-identity-resolution-service
          relationship: realised_through
          description: Dedicated identity resolution engine

    - service: dea:service-customer-notification
      components:
        - id: dea:component-notification-gateway
          relationship: realised_through
          description: Multi-channel notification gateway (email, SMS, push)

    - service: dea:service-finance-accounting
      components:
        - id: dea:component-erp-core
          relationship: realised_through
          description: Core ERP system providing general ledger and AP/AR
        - id: dea:component-general-ledger
          relationship: realised_through
          description: General ledger sub-system

    - service: dea:service-finance-reporting
      components:
        - id: dea:component-financial-reporting-engine
          relationship: realised_through
          description: Financial reporting and management reporting engine
        - id: dea:component-bi-platform
          relationship: realised_through
          description: BI platform for ad-hoc financial analysis

    - service: dea:service-treasury-management
      components:
        - id: dea:component-treasury-management-system
          relationship: realised_through
          description: Dedicated treasury management system
        - id: dea:component-payment-gateway
          relationship: realised_through
          description: Payment initiation and settlement gateway

    - service: dea:service-order-taking
      components:
        - id: dea:component-order-management-system
          relationship: realised_through
          description: OMS handles order capture, validation, and order management
        - id: dea:component-ecommerce-platform
          relationship: realised_through
          description: E-commerce platform for digital order capture

    - service: dea:service-order-fulfillment
      components:
        - id: dea:component-warehouse-management-system
          relationship: realised_through
          description: WMS manages warehouse operations and fulfillment
        - id: dea:component-carrier-integration
          relationship: realised_through
          description: Carrier integration for label generation and tracking

    - service: dea:service-inventory-management
      components:
        - id: dea:component-inventory-management-system
          relationship: realised_through
          description: Inventory tracking and optimisation system

    - service: dea:service-procurement
      components:
        - id: dea:component-procurement-system
          relationship: realised_through
          description: End-to-end procurement and sourcing system

    - service: dea:service-talent-management
      components:
        - id: dea:component-talent-management-system
          relationship: realised_through
          description: TMS for recruitment, performance, and learning

    - service: dea:service-payroll
      components:
        - id: dea:component-payroll-system
          relationship: realised_through
          description: Payroll processing system
