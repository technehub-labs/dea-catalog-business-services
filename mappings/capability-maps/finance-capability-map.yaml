# Finance Capability Map

capability_map:
  domain: Finance
  description: >
    Maps finance domain capabilities to the services that realise them
    and the solution components that implement each service.
  capabilities:
    - id: dea:capability-financial-closing
      name: Financial Closing
      description: >
        The ability to produce accurate and timely period-end financial closes
        with proper reconciliation, journal entries, and audit trails.
      maturity_target: Optimised
      services:
        - services:service-finance-accounting-qmxysp
      kpis:
        - close_days: Number of days to complete period close (target: ≤5)
        - adjustment_rate: Journal adjustments as % of total transactions (target: <1%)

    - id: dea:capability-financial-planning
      name: Financial Planning and Analysis
      description: >
        The ability to produce budget, forecast, and variance analysis
        across all organisational units and financial dimensions.
      maturity_target: Managed
      services:
        - services:service-finance-reporting-ev9c4k
      kpis:
        - forecast_accuracy: Forecast vs actual variance (target: ±5%)
        - planning_cycle_days: Days to complete annual planning cycle (target: ≤45)

    - id: dea:capability-cash-management
      name: Cash Management
      description: >
        The ability to forecast cash position, optimise liquidity, manage
        banking relationships, and process payments accurately.
      maturity_target: Managed
      services:
        - services:service-treasury-management-8tc77w
      kpis:
        - cash_position_accuracy: Forecast vs actual cash (target: ±2%)
        - payment_accuracy: Failed payments as % of total (target: <0.1%)
