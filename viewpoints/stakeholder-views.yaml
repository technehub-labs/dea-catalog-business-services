# CTO, Chief Architect, Solutions Architect, Business Architect viewpoints for DBSF

viewpoints:
  - stakeholder: CTO
    description: >
      The CTO uses DBSF to understand the enterprise's service portfolio breadth,
      SLA exposure, and compliance surface area. Focuses on platinum-tier services
      and cross-domain service dependencies that represent concentration risk.
    concern: >
      What is our most critical service exposure? Where are our compliance risks?
      Are we over-dependent on any single service?
    services_of_interest:
      - services:service-customer-360-ut9yeu
      - services:service-finance-accounting-qmxysp
      - services:service-treasury-management-8tc77w
      - services:service-payroll-t8x26e
    governance_focus:
      - SLA tier distribution across portfolio
      - Compliance coverage (SOX, GDPR, PCI-DSS)
      - Platinum-tier service resilience

  - stakeholder: ChiefArchitect
    description: >
      The Chief Architect uses DBSF to govern service design quality,
      relationship integrity, and cross-service consistency.
    concern: >
      Are all services correctly typed against the metamodel? Are relationship
      types accurate? Do capability maps form coherent decompositions?
    services_of_interest:
      - services:service-customer-360-ut9yeu
      - services:service-finance-accounting-qmxysp
      - services:service-order-taking-es2d2g
      - services:service-inventory-management-g8xbwr
    design_focus:
      - Service boundary quality
      - Relationship type correctness
      - Capability decomposition coherence
      - Cross-service consistency

  - stakeholder: SolutionsArchitect
    description: >
      The Solutions Architect uses DBSF to identify which services a new
      solution must integrate with and what governance constraints apply.
    concern: >
      Which existing services does my solution connect to? What are the
      integration patterns? What governance requirements apply?
    services_of_interest:
      - services:service-customer-360-ut9yeu
      - services:service-product-catalog-7vytmc
      - services:service-order-taking-es2d2g
      - services:service-order-fulfillment-ceuq33
      - services:service-finance-accounting-qmxysp
    integration_focus:
      - Service APIs and integration patterns
      - SLA requirements from governance contracts
      - Security classification and compliance requirements

  - stakeholder: BusinessArchitect
    description: >
      The Business Architect uses DBSF to map business capabilities to services,
      understand capability maturity, and plan service improvements.
    concern: >
      Which services underpin which business capabilities? Where are the
      capability gaps? What is the capability maturity trajectory?
    services_of_interest:
      - services:service-customer-360-ut9yeu
      - services:service-product-catalog-7vytmc
      - services:service-order-taking-es2d2g
      - services:service-finance-reporting-ev9c4k
      - services:service-hr-core-98hdbh
    capability_focus:
      - Capability-to-service mapping
      - Capability maturity scores
      - Service improvement priorities
